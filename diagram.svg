<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" font-family="Arial" font-size="14">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d00"/></marker>
</defs>
<rect width="1000" height="430" fill="white"/>
<text x="500" y="28" text-anchor="middle" font-size="17" font-weight="bold">Варіант 23: розподіл обчислень по потоках і точки синхронізації</text>
<text x="500" y="50" text-anchor="middle">Залежності: B(A1, A2), C1(B), C2(B, D), F(D).   "Повільні": A2, D (7 с), решта "швидкі" (1 с)</text>

<!-- thread labels -->
<text x="140" y="105" text-anchor="end" font-weight="bold">main</text>
<text x="140" y="185" text-anchor="end" font-weight="bold">async #1</text>
<text x="140" y="265" text-anchor="end" font-weight="bold">async #2</text>

<!-- main: A2 [0-7], B [7-8], C1 [8-9] -->
<rect x="150" y="80" width="490" height="40" fill="#f4a261" stroke="#333"/><text x="395" y="105" text-anchor="middle">A2 (повільне)</text>
<rect x="640" y="80" width="70" height="40" fill="#8ecae6" stroke="#333"/><text x="675" y="105" text-anchor="middle">B</text>
<rect x="710" y="80" width="70" height="40" fill="#8ecae6" stroke="#333"/><text x="745" y="105" text-anchor="middle">C1</text>

<!-- async #1: A1 [0-1] -->
<rect x="150" y="160" width="70" height="40" fill="#8ecae6" stroke="#333"/><text x="185" y="185" text-anchor="middle">A1</text>

<!-- async #2: D [0-7], F [7-8], C2 [8-9] -->
<rect x="150" y="240" width="490" height="40" fill="#f4a261" stroke="#333"/><text x="395" y="265" text-anchor="middle">D (повільне)</text>
<rect x="640" y="240" width="70" height="40" fill="#8ecae6" stroke="#333"/><text x="675" y="265" text-anchor="middle">F</text>
<rect x="710" y="240" width="70" height="40" fill="#8ecae6" stroke="#333"/><text x="745" y="265" text-anchor="middle">C2</text>

<!-- sync 1: A1 -> B (t1.wait) -->
<path d="M220,160 L636,122" stroke="#d00" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arr)"/>
<text x="250" y="140" fill="#d00">1: t1.wait() — A1 виконано</text>
<!-- sync 2: B -> C2 (promise) -->
<path d="M710,122 L710,236" stroke="#d00" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arr)"/>
<text x="600" y="178" fill="#d00" text-anchor="end">2: b_done.set_value() →</text><text x="600" y="196" fill="#d00" text-anchor="end">b_ready.wait() — B виконано</text>
<!-- sync 3: end of async #2 -> Work is done -->
<path d="M780,260 C840,260 840,100 784,100" stroke="#d00" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arr)"/>
<text x="842" y="185" fill="#d00">3: t2.wait()</text>
<text x="790" y="72" font-weight="bold">Work is done!</text>

<!-- time axis -->
<line x1="150" y1="305" x2="780" y2="305" stroke="#333"/>
<g text-anchor="middle" font-size="13">
<line x1="150" y1="300" x2="150" y2="310" stroke="#333"/><text x="150" y="325">0</text>
<line x1="220" y1="300" x2="220" y2="310" stroke="#333"/><text x="220" y="325">1</text>
<line x1="290" y1="300" x2="290" y2="310" stroke="#333"/><text x="290" y="325">2</text>
<line x1="360" y1="300" x2="360" y2="310" stroke="#333"/><text x="360" y="325">3</text>
<line x1="430" y1="300" x2="430" y2="310" stroke="#333"/><text x="430" y="325">4</text>
<line x1="500" y1="300" x2="500" y2="310" stroke="#333"/><text x="500" y="325">5</text>
<line x1="570" y1="300" x2="570" y2="310" stroke="#333"/><text x="570" y="325">6</text>
<line x1="640" y1="300" x2="640" y2="310" stroke="#333"/><text x="640" y="325">7</text>
<line x1="710" y1="300" x2="710" y2="310" stroke="#333"/><text x="710" y="325">8</text>
<line x1="780" y1="300" x2="780" y2="310" stroke="#333"/><text x="780" y="325">9 с</text>
</g>

<text x="40" y="365">Загальний час 9 с — мінімально можливий: найдовший ланцюжок залежностей A2 → B → C1 (7 + 1 + 1).</text>
<text x="40" y="387">Потоків 3 (main + 2 запуски async): у момент 0 обидва повільні A2, D і A1 мають виконуватися одночасно,</text>
<text x="40" y="409">інакше B не почнеться в момент 7 с. Червоні пунктирні стрілки — точки синхронізації (засоби &lt;future&gt;).</text>
</svg>
